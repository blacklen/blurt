name = "blurt"
main = "src/index.js"
# This login has more than one Cloudflare account, so wrangler must be told
# which one owns the Worker and the D1 database (otherwise it guesses, and the
# API answers 7403/7404). An account id is not a secret.
account_id = "8662a7c5ebb4d152d076beea42bdaec6"
compatibility_date = "2025-01-01"

# Fire the daily homework reminder. Cron runs at the top of every hour; the
# scheduled() handler sends a ping only when the current hour matches the user's
# chosen time. Letting the server own the schedule (instead of pre-queuing ntfy
# X-Delay messages, which can't be cancelled) is what stops changing the reminder
# time from producing duplicate pings. Test locally with `wrangler dev --test-scheduled`.
[triggers]
crons = ["0 * * * *"]

# App data (state + chunk bank) lives in D1. Create it with `npm run db:create`,
# paste the printed database_id here, then apply the schema with `npm run db:migrate`.
[[d1_databases]]
binding = "BLURT_DB"
database_name = "blurt"
database_id = "294038a9-8877-45bb-aad7-52f0f52f5ee9"

# KV is kept for exactly two throwaway counters — the login brute-force tally and
# the "reminder already sent today" marker. Both want a TTL so they expire on
# their own, which KV gives free and D1 would need a cleanup query for. Together
# they are ~2 writes/day, nowhere near the free plan's 1,000/day write cap.
# It also still holds the pre-D1 data, which the Worker reads once to migrate.
[[kv_namespaces]]
binding = "BLURT_KV"
id = "bbd78c19aa154c148a0337ac3ce8501a"

# Serve the app itself at / straight from ./public (no build step — public/index.html is the whole UI).
# Static assets are served first; anything unmatched (i.e. /api/*) runs the Worker.
[assets]
directory = "./public"
# lets the cron read prompts.json for micro-rep pings
binding = "ASSETS"
